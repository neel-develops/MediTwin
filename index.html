<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediTwin</title>
  <meta name="description" content="MediTwin — data-driven 3D hospital resource inventory and allocation prototype (synthetic demo data).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111315">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=23">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app">
    <header class="topbar">
      <div class="page-title"><strong id="page-title">MediTwin</strong><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav></div>
      <div class="global-search" role="search">
        <label class="search-field">
          <span class="sr-only">Search beds, wards, equipment or patients</span>
          <span data-icon="search"></span>
          <input id="global-search" type="search" autocomplete="off" placeholder="Search bed, ward, equipment or patient…" aria-controls="search-results" aria-expanded="false">
        </label>
        <div class="search-results" id="search-results" role="listbox" hidden></div>
      </div>
      <button class="icon-btn bell" id="alerts-btn" data-act="go" data-route="alerts" aria-label="Alerts">
        <span data-icon="bell"></span><span class="badge" id="alerts-badge" hidden></span>
      </button>
      <div class="user-chip" title="Demo Staff — demo role, no real authentication">
        <span class="avatar" aria-hidden="true">DS</span>
      </div>
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation" aria-expanded="false"><span data-icon="list"></span></button>
    </header>

    <nav class="sidenav" id="sidenav" aria-label="Main">
      <a class="brand" href="#/allocations" aria-label="MediTwin home — Bed Allocations" title="MediTwin · Smarter Hospital Resource Allocation"><span class="brand-mark" aria-hidden="true"></span></a>
      <a href="#/allocations" data-nav="allocations"><span data-icon="bed"></span>Bed Allocations</a>
      <a href="#/patients" data-nav="patients"><span data-icon="user"></span>Patients</a>
      <a href="#/equipment" data-nav="equipment"><span data-icon="monitor"></span>Equipment</a>
      <a href="#/alerts" data-nav="alerts"><span data-icon="bell"></span>Alerts<span class="nav-badge" id="nav-alerts-badge" hidden></span></a>
      <a href="#/reports" data-nav="reports"><span data-icon="chart"></span>Reports</a>
      <a href="#/setup" data-nav="setup"><span data-icon="hospital"></span>Setup</a>
      <a href="#/settings" data-nav="settings"><span data-icon="gear"></span>Settings</a>
      <div class="nav-foot">
        <div class="demo-card">
          <div class="demo-line" title="Fictional records stored in this browser. Not connected to any hospital system."><span class="dot"></span>DEMO</div>
          <small>Fictional records stored in this browser. Not connected to any hospital system.</small>
          <small id="last-updated"></small>
        </div>
      </div>
    </nav>

    <main id="main" tabindex="-1"></main>
  </div>
  <div id="modal-root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="js/services.js?v=23"></script>
  <script src="js/scene.js?v=23"></script>
  <script src="js/app.js?v=23"></script>
</body>
</html>
